<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>目前離線｜CSV 瀏覽器</title>
  <style>
    :root { --bg:#f8fafc; --fg:#0f172a; --muted:#64748b; --card:#fff; --brand:#4f46e5; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0b1120; --fg:#e2e8f0; --muted:#94a3b8; --card:#111827; --brand:#818cf8; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--fg);
      font-family: "Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    .card {
      width: 100%; max-width: 420px; text-align: center; padding: 32px 24px;
      background: var(--card); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    .icon { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 1.35rem; margin: 16px 0 8px; }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 24px; }
    button {
      appearance: none; border: 0; cursor: pointer; width: 100%; min-height: 48px;
      border-radius: 12px; font-size: 1rem; font-weight: 600; color: #fff; background: var(--brand);
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="/pwa/icons/icon-192.png" alt="">
    <h1>目前沒有網路連線</h1>
    <p>載入公開資料需要網路。請確認連線後再試一次。</p>
    <button onclick="location.reload()">重新連線</button>
  </main>
</body>
</html>
