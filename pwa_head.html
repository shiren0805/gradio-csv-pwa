<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#4f46e5">
<meta name="application-name" content="CSV 瀏覽器">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CSV 瀏覽器">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/pwa/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/pwa/icons/favicon-32.png">

<style>
  #pwa-bar {
    position: fixed; z-index: 9999; left: 12px; right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    max-width: 520px; margin: 0 auto; padding: 12px 14px;
    display: none; align-items: center; gap: 10px;
    background: #4f46e5; color: #fff; border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,.25); font-size: 14px; line-height: 1.4;
  }
  #pwa-bar.show { display: flex; }
  #pwa-bar span { flex: 1; }
  #pwa-bar button {
    border: 0; cursor: pointer; border-radius: 10px; min-height: 38px; padding: 0 14px;
    font-size: 14px; font-weight: 600;
  }
  #pwa-bar .go { background: #fff; color: #4f46e5; }
  #pwa-bar .x  { background: transparent; color: #fff; padding: 0 8px; font-size: 18px; }
</style>

<script>
(function () {
  // 1) 註冊 Service Worker（需要 HTTPS 或 localhost）
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(function (err) {
        console.warn("Service Worker 註冊失敗：", err);
      });
    });
  }

  function isStandalone() {
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  }
  function dismissed() { try { return localStorage.getItem("pwa-dismissed") === "1"; } catch (e) { return false; } }
  function setDismissed() { try { localStorage.setItem("pwa-dismissed", "1"); } catch (e) {} }

  function showBar(text, onInstall) {
    function build() {
      if (document.getElementById("pwa-bar")) return;
      var bar = document.createElement("div");
      bar.id = "pwa-bar";
      bar.innerHTML = "<span></span>";
      bar.firstChild.textContent = text;
      if (onInstall) {
        var go = document.createElement("button");
        go.className = "go"; go.textContent = "安裝";
        go.onclick = function () { bar.classList.remove("show"); onInstall(); };
        bar.appendChild(go);
      }
      var x = document.createElement("button");
      x.className = "x"; x.setAttribute("aria-label", "關閉"); x.textContent = "✕";
      x.onclick = function () { bar.classList.remove("show"); setDismissed(); };
      bar.appendChild(x);
      document.body.appendChild(bar);
      requestAnimationFrame(function () { bar.classList.add("show"); });
    }
    if (document.body) build(); else document.addEventListener("DOMContentLoaded", build);
  }

  // 2) Android / 桌面 Chrome、Edge：自訂安裝提示
  var deferred = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferred = e;
    if (!isStandalone() && !dismissed()) {
      showBar("安裝成 App，開啟更快、全螢幕使用", function () {
        deferred.prompt();
        deferred.userChoice.finally(function () { deferred = null; });
      });
    }
  });
  window.addEventListener("appinstalled", function () {
    var bar = document.getElementById("pwa-bar");
    if (bar) bar.classList.remove("show");
  });

  // 3) iOS Safari 不支援 beforeinstallprompt，改為文字教學
  var ua = navigator.userAgent || "";
  var isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isSafari = /safari/i.test(ua) && !/crios|fxios|edgios/i.test(ua);
  if (isIOS && isSafari && !isStandalone() && !dismissed()) {
    window.addEventListener("load", function () {
      setTimeout(function () { showBar("點選分享按鈕，再選「加入主畫面」即可安裝", null); }, 2500);
    });
  }
})();
</script>
